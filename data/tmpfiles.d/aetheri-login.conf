d /run/aetheri/login               0755 root           root           -
d /run/aetheri/login-greeter       0700 aetheri-greeter aetheri-greeter -
d /run/aetheri/login-tmp           1733 root           root           -
d /run/aetheri/login-shm           1733 root           root           -
