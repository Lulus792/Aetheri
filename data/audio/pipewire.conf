# Aetheri's local desktop graph. The session owner selects the runtime directory.
context.properties = {
    core.daemon = true
    core.name = aetheri-audio
    mem.allow-mlock = false
    support.dbus = false
}

context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
    api.alsa.* = alsa/libspa-alsa
}

context.modules = [
    { name = libpipewire-module-protocol-native args = {
        sockets = [ { name = aetheri-audio mode = 0600 } ]
    } }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access args = {
        access.legacy = false
        access.socket = { aetheri-audio = unrestricted }
    } }
]

context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Aetheri-Driver
        priority.driver = 200000
    } }
]
