context.properties = {
    mem.allow-mlock = false
    support.dbus = false
}

# The desktop session owns this instance. Hardware permissions come from
# the active logind session and the installed audio process policy.
wireplumber.profiles = {
    aetheri-desktop = {
        inherits = [ main-embedded ]
        monitor.alsa = required
        monitor.alsa-midi = disabled
        hardware.bluetooth = disabled
        hardware.video-capture = disabled
        support.dbus = disabled
        support.system-dbus = disabled
        support.modem-manager = disabled
        hooks.device.profile.find-voice-call = disabled
        support.mpris = disabled
        hooks.linking.pause-playback = disabled
        api.notifications = disabled
    }
}

# Use the HDA card profiles carried in the image. Use-case data for other
# board-specific audio paths can be selected when those boards are supported.
monitor.alsa.properties = { alsa.use-acp = true }
monitor.alsa.rules = [
    { matches = [ { device.name = "~alsa_card.*" } ] actions = {
        update-props = { api.alsa.use-acp = true api.alsa.use-ucm = false }
    } }
]
