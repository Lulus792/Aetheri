<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="org.aetheri.Wlan1"/></policy>
  <policy context="default">
    <allow send_destination="org.aetheri.Wlan1" send_path="/org/aetheri/Wlan1"
           send_interface="org.aetheri.Wlan1" send_member="GetState" send_type="method_call"/>
    <allow send_destination="org.aetheri.Wlan1" send_path="/org/aetheri/Wlan1"
           send_interface="org.aetheri.Wlan1" send_member="SetEnabled" send_type="method_call"/>
    <allow send_destination="org.aetheri.Wlan1" send_path="/org/aetheri/Wlan1"
           send_interface="org.aetheri.Wlan1" send_member="StartScan" send_type="method_call"/>
    <allow send_destination="org.aetheri.Wlan1" send_path="/org/aetheri/Wlan1"
           send_interface="org.aetheri.Wlan1" send_member="GetNetworks" send_type="method_call"/>
  </policy>
  <policy context="mandatory">
    <deny send_destination="org.aetheri.Wlan1" send_type="method_call" min_fds="1"/>
  </policy>
</busconfig>
