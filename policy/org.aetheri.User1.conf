<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <selinux>
    <associate own="org.aetheri.User1" context="system_u:object_r:aetheri_user_service_t:s0"/>
  </selinux>
  <policy context="mandatory">
    <deny send_destination="org.aetheri.User1" send_type="method_call" min_fds="1"/>
  </policy>
</busconfig>
