<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <selinux>
    <associate own="org.aetheri.System1" context="system_u:object_r:aetheri_system_service_t:s0"/>
  </selinux>
  <policy user="root"><allow own="org.aetheri.System1"/></policy>
  <policy context="default"><allow send_destination="org.aetheri.System1"/></policy>
  <policy context="mandatory">
    <deny send_destination="org.aetheri.System1" send_type="method_call" min_fds="1"/>
  </policy>
</busconfig>
