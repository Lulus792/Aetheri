<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="systemd-resolve">
    <allow own="org.freedesktop.resolve1"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.freedesktop.resolve1" send_path="/org/freedesktop/resolve1"
           send_interface="org.freedesktop.resolve1.Manager" send_member="SetLinkDNS"
           send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.resolve1" send_path="/org/freedesktop/resolve1"
           send_interface="org.freedesktop.resolve1.Manager" send_member="SetLinkDomains"
           send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.resolve1" send_path="/org/freedesktop/resolve1"
           send_interface="org.freedesktop.resolve1.Manager" send_member="SetLinkMulticastDNS"
           send_type="method_call" max_fds="0"/>
    <allow send_destination="org.freedesktop.resolve1" send_path="/org/freedesktop/resolve1"
           send_interface="org.freedesktop.resolve1.Manager" send_member="RevertLink"
           send_type="method_call" max_fds="0"/>
  </policy>
</busconfig>
